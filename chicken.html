<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Path Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Learning Path Chatbot</h1>
    <p>Ask your questions about certifications or learning paths to get personalized recommendations using AI.</p>

    <!-- Watson Assistant Web Chat Script -->
    <script>
        window.watsonAssistantChatOptions = {
            integrationID: "eb900564-d5bb-4798-b6aa-1b83f6d44e01", // Replace with your Integration ID
            region: "us-south", // Replace with your region
            serviceInstanceID: "b482f6a7-0db5-4d1a-af16-e6c553cef6d2", // Replace with your service instance ID
            onLoad: function(instance) { instance.render(); }
        };
        setTimeout(function(){
            const t=document.createElement('script');
            t.src="https://web-chat.global.assistant.watson.appdomain.cloud/loadWatsonAssistantChat.js";
            document.head.appendChild(t);
        });
    </script>
</body>
</html>
