<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WiseChicken Course Chatbot</title>
  <meta name="description" content="WiseChicken – AI-powered course recommendation chatbot." />
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <span class="chicken" aria-hidden="true">🐥</span>
      <h1 class="title">WiseChicken</h1>
    </div>
    <div class="controls">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="chat-container" id="chat" role="log" aria-live="polite"></div>

  <div class="input-bar">
    <textarea id="userInput" placeholder="Type your message (Enter to send, Shift+Enter for newline)..." rows="1" aria-label="Chat input"></textarea>
    <button id="sendBtn" aria-label="Send message">Send</button>
  </div>

  <noscript>This app requires JavaScript enabled.</noscript>
  <script src="script.js"></script>
</body>
</html>
